name: Build Mod Jar

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'

      - name: Install Gradle 2.14
        run: |
          wget -q https://services.gradle.org/distributions/gradle-2.14-bin.zip
          unzip -q gradle-2.14-bin.zip
          echo "$PWD/gradle-2.14/bin" >> $GITHUB_PATH

      - name: Build with Gradle
        run: gradle build --no-daemon --stacktrace

      - name: Upload built jar
        uses: actions/upload-artifact@v4
        with:
          name: antikb-jar
          path: build/libs/*.jar
